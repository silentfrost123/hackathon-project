<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JISR جسر — Demo portal</title>
<meta name="description" content="Interactive JISR demo: talent, business, mentor and programme admin views with sample data.">
<meta name="theme-color" content="#0B1626">
<meta name="robots" content="noindex">
<script>(function(){try{var q=new URLSearchParams(location.search).get('lang');var l=q||localStorage.getItem('jisr.lang');if(l==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';}}catch(e){}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E9A93A'/%3E%3Cg fill='none' stroke='%230B1626' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M5 22h22'/%3E%3Cpath d='M8 22c0-6 3.5-9.5 8-9.5s8 3.5 8 9.5'/%3E%3Cpath d='M12.5 22v-4.5'/%3E%3Cpath d='M19.5 22v-4.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Readex+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="app">
<script src="assets/js/icons.js"></script>
<a class="skip-link" href="#main" data-i18n="app.skip">Skip to content</a>

<header class="app-header">
  <div class="container bar">
    <a class="brand" href="index.html" data-keep-lang aria-label="JISR home" data-i18n-attr="aria-label:app.home">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-bridge"></use></svg></span>
      <span class="brand-name"><span class="brand-latin">JISR</span><span class="brand-arabic" lang="ar">جسر</span></span>
    </a>
    <nav class="role-switch" aria-label="Switch view" data-i18n-attr="aria-label:app.views">
      <a href="#talent" data-role="talent"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="role.talent">Talent</span></a>
      <a href="#business" data-role="business"><svg class="icon" aria-hidden="true"><use href="#i-building"></use></svg><span data-i18n="role.business">Business</span></a>
      <a href="#mentor" data-role="mentor"><svg class="icon" aria-hidden="true"><use href="#i-cap"></use></svg><span data-i18n="role.mentor">Mentor</span></a>
      <a href="#admin" data-role="admin"><svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg><span data-i18n="role.admin">Admin</span></a>
    </nav>
    <span class="spacer"></span>
    <span class="badge badge-demo" data-i18n="app.demo">Demo data</span>
    <span class="who" id="who"></span>
    <button type="button" class="lang-toggle" data-lang-toggle aria-label="التبديل إلى العربية">
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-globe"></use></svg><span class="lang-label lang-label-ar">العربية</span>
    </button>
  </div>
  <nav class="role-tabs" aria-label="Switch view" data-i18n-attr="aria-label:app.views">
    <a href="#talent" data-role="talent"><svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="role.talent">Talent</span></a>
    <a href="#business" data-role="business"><svg class="icon" aria-hidden="true"><use href="#i-building"></use></svg><span data-i18n="role.business">Business</span></a>
    <a href="#mentor" data-role="mentor"><svg class="icon" aria-hidden="true"><use href="#i-cap"></use></svg><span data-i18n="role.mentor">Mentor</span></a>
    <a href="#admin" data-role="admin"><svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg><span data-i18n="role.admin">Admin</span></a>
  </nav>
</header>

<div class="demo-banner" role="note">
  <div class="container">
    <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
    <p data-i18n="app.banner">You're using an interactive demo. Names and amounts are sample data, and what you do is saved only in this browser.</p>
    <button type="button" class="btn btn-ghost btn-sm" data-act="reset" aria-label="Reset demo" data-i18n-attr="aria-label:app.reset"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-refresh"></use></svg><span class="hide-sm" data-i18n="app.reset">Reset demo</span></button>
  </div>
</div>

<main id="main" class="app-main">
  <div class="container" id="view" aria-live="off">
    <noscript><p>The JISR demo needs JavaScript enabled.</p></noscript>
  </div>
</main>

<div id="modal-root"></div>
<div id="toasts" class="toast-region" aria-live="polite"></div>

<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
